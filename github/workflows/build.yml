name: Build HAMA-IOS Dylib

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -sSL "https://github.com/theos/sdks/archive/master.tar.gz" | tar -xz -C /tmp
          SDK_DIR=$(find /tmp -maxdepth 2 -name "*.sdk" | head -n 1)
          if [ -n "$SDK_DIR" ]; then
            mv "$SDK_DIR" $THEOS/sdks/
          fi

      - name: Prepare Theos Project
        run: |
          export THEOS=/opt/theos
          mkdir -p hama_dylib
          cp main.xm hama_dylib/Tweak.xm
          cat << 'EOF' > hama_dylib/Makefile
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64
          INSTALL_TARGET_PROCESSES = ShadowTrackerExtra
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = HamaPubgHub
          HamaPubgHub_FILES = Tweak.xm
          HamaPubgHub_FRAMEWORKS = UIKit Foundation QuartzCore
          include $(THEOS)/makefiles/tweak.mk
          EOF

      - name: Compile Dylib
        run: |
          export THEOS=/opt/theos
          cd hama_dylib
          make package FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-IOS-PUBG-Dylib
          path: hama_dylib/.theos/obj/iphone_ arm64/HamaPubgHub.dylib
