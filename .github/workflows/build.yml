name: Build HAMA-IOS Dylib

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -sSL "https://github.com/theos/sdks/archive/master.tar.gz" | tar -xz -C /tmp
          SDK_DIR=$(find /tmp -maxdepth 2 -name "*.sdk" | head -n 1)
          if [ -n "$SDK_DIR" ]; then
            mv "$SDK_DIR" "$THEOS/sdks/"
          fi

      - name: Compile Dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-IOS-PUBG-Dylib
          path: .theos/obj/**/HamaPubgHub.dylib
